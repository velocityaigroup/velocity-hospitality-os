<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b82"/>
    </marker>
    <style>
      .t{fill:#0f1a2b} .m{fill:#5b6b82} .w{fill:#fff}
      .h{font-size:12px;letter-spacing:.12em;fill:#5b6b82;font-weight:700}
      .lbl{font-size:13px;font-weight:600;fill:#0f1a2b}
      .sm{font-size:11.5px;fill:#5b6b82}
      .box{fill:#fff;stroke:#e4e9f1;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect width="1040" height="660" fill="#f7f9fc"/>
  <text x="34" y="42" font-size="20" font-weight="700" class="t">Velocity Hospitality OS — Model-Agnostic Architecture</text>
  <text x="34" y="64" class="sm">Self-hosted on provided compute. The model is a swappable provider; all retrieval, guardrails, citations, evaluation and workflow logic are model-independent.</text>

  <!-- INPUTS -->
  <rect x="34" y="100" width="150" height="150" rx="12" class="box"/>
  <text x="48" y="124" class="h">INPUTS</text>
  <text x="48" y="150" class="sm">PMS events</text>
  <text x="48" y="170" class="sm">POS / Micros</text>
  <text x="48" y="190" class="sm">Guest messages</text>
  <text x="48" y="210" class="sm">Applications</text>
  <text x="48" y="230" class="sm">Reviews · schedules</text>

  <!-- MODEL PROVIDER (pluggable) -->
  <rect x="34" y="300" width="360" height="316" rx="12" fill="#0e4f8f"/>
  <text x="52" y="330" font-size="12" letter-spacing=".12em" font-weight="700" fill="#cfe0f4">MODEL PROVIDER · PLUGGABLE</text>
  <text x="52" y="352" font-size="12.5" fill="#eaf2fb">One LLM + Embeddings interface — swap freely.</text>
  <!-- backends -->
  <rect x="52" y="368" width="324" height="52" rx="9" fill="#12a594"/>
  <text x="66" y="390" font-size="13" font-weight="700" fill="#fff">● Open-weights on H200 — OFFICIAL impl</text>
  <text x="66" y="408" font-size="11.5" fill="#dff5f0">Qwen3.6-27B (Apache-2.0) · vLLM · self-hosted</text>
  <rect x="52" y="428" width="324" height="40" rx="9" fill="#1b6fb0"/>
  <text x="66" y="453" font-size="12.5" fill="#fff">● Local proof model — validates the full path today</text>
  <rect x="52" y="476" width="212" height="40" rx="9" fill="#1b6fb0"/>
  <text x="66" y="501" font-size="12" fill="#fff">● Bedrock (Converse) · Nova</text>
  <rect x="272" y="476" width="104" height="40" rx="9" fill="#24557f"/>
  <text x="286" y="501" font-size="12" fill="#cfe0f4">○ Others*</text>
  <text x="52" y="540" font-size="11" fill="#9db8d6">Converse API = foundation-model agnostic. * addable with no code change.</text>
  <text x="52" y="576" font-size="11" fill="#9db8d6">Model choice is config only. Gated models → use Nova / open weights. Not blocked.</text>

  <!-- MODEL-INDEPENDENT CORE -->
  <rect x="430" y="100" width="300" height="150" rx="12" fill="#fff" stroke="#12a594" stroke-width="1.5"/>
  <text x="446" y="124" class="h">MODEL-INDEPENDENT CORE</text>
  <text x="446" y="150" class="lbl">Retrieval (RAG) over property SOPs</text>
  <text x="446" y="172" class="lbl">Grounding guardrail → refuse if unsupported</text>
  <text x="446" y="194" class="lbl">Citations (source SOP ids)</text>
  <text x="446" y="216" class="lbl">Evaluation harness (accuracy / refusal)</text>
  <text x="446" y="238" class="sm">Unchanged whatever model answers.</text>

  <!-- AGENTS -->
  <rect x="430" y="300" width="300" height="150" rx="12" class="box"/>
  <text x="446" y="330" class="h">SUPERVISED AGENTS</text>
  <text x="446" y="356" class="lbl">SOP Coach  ·  Executive Intelligence</text>
  <text x="446" y="378" class="lbl">HR Onboarding</text>
  <text x="446" y="404" class="sm">+ Work Order · Revenue · Guest Recovery ·</text>
  <text x="446" y="422" class="sm">Workforce Planning (roadmap)</text>

  <!-- HUMAN APPROVAL -->
  <rect x="770" y="300" width="236" height="150" rx="12" fill="#fff8ef" stroke="#f0dcae" stroke-width="1.5"/>
  <text x="786" y="330" class="h">HUMAN-IN-THE-LOOP</text>
  <text x="786" y="356" class="lbl">Approval gate</text>
  <text x="786" y="380" class="sm">Anything that moves money,</text>
  <text x="786" y="398" class="sm">staffing or the guest relationship</text>
  <text x="786" y="416" class="sm">is held for a person.</text>

  <!-- ACTIONS / SYSTEMS -->
  <rect x="770" y="100" width="236" height="70" rx="12" class="box"/>
  <text x="786" y="124" class="h">ACTIONS → SYSTEMS</text>
  <text x="786" y="150" class="sm">Approved actions written back (PMS/POS/payroll)</text>

  <!-- REPORTING -->
  <rect x="770" y="185" width="236" height="65" rx="12" class="box"/>
  <text x="786" y="209" class="h">REPORTING · AUDIT</text>
  <text x="786" y="234" class="sm">Every decision + action logged</text>

  <!-- arrows -->
  <line x1="184" y1="175" x2="428" y2="175" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="214" y1="300" x2="214" y2="252" stroke="#12a594" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="222" y="278" font-size="11" fill="#12a594">serves</text>
  <line x1="580" y1="250" x2="580" y2="298" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="730" y1="375" x2="768" y2="375" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="888" y1="300" x2="888" y2="255" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="898" y="280" font-size="11" fill="#5b6b82">approved</text>
  <line x1="888" y1="185" x2="888" y2="172" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- loop back reporting -> inputs (routed through the free band at y~278) -->
  <path d="M770,240 C620,300 300,300 109,252" fill="none" stroke="#c8862b" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="356" y="292" font-size="11" fill="#c8862b">continuous improvement loop</text>
</svg>
