[project]
name = "velocity-hospitality-os"
version = "0.1.0"
description = "The agentic execution layer for hospitality — seven supervised AI agents with human-in-the-loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Druvaughn Edwards", email = "druedwards3@gmail.com" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly rather than left to ruff's defaults.
#
# CI installs ruff unpinned (`ruff>=0.4`). A release in Aug 2026 widened the
# default rule set, and every build from 1 Aug onward went red without a line of
# code changing - 71 findings under ruff 0.16.4, zero under 0.15.11, same commit.
# A lint result that depends on the day you run it is not a signal, so the rule
# set is now stated here and moves only when we choose to move it.
#
# E4 imports · E7 statements · E9 syntax/IO errors · F pyflakes.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["E402"]
"tests/*" = ["E402"]
"demo/*" = ["E402"]
"scripts/*" = ["E402"]
"ui/*" = ["E402"]
